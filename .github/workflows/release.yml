# Release: on a v* tag, build the UI bundle, cross-compile binaries
# for linux/macos/windows × amd64/arm64, and publish a GitHub Release
# with archives + checksums via GoReleaser.
#
# To cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  changelog-check:
    name: CHANGELOG has a section for the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the tag has a CHANGELOG heading
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -Eq "^## ${TAG}( |\$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## ${TAG}' heading in CHANGELOG.md — every release tag needs a changelog section. Add '## ${TAG} (YYYY-MM-DD)', re-tag, and push again."
            exit 1
          fi
          echo "CHANGELOG.md has a '## ${TAG}' heading."

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: changelog-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so GoReleaser can build a changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Install Convex dependencies
        # ui/ imports @db/api which transitively imports convex/server
        # from db/node_modules, so the db workspace must be installed.
        working-directory: db
        run: bun install --frozen-lockfile

      - name: Build UI bundle
        working-directory: wrapper
        run: make ui-build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on
          # nkls-ai/homebrew-dftstream. While this secret is unset the
          # cask publish is skipped (see homebrew_casks.skip_upload in
          # .goreleaser.yaml) and the rest of the release proceeds.
          # Setup steps: packaging/README.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
